<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wgpuTerminal</title>
  <link rel="stylesheet" href="../wgpuTerminal/css/terminal.css">
  <style>
    @font-face { font-family: "JetBrains Mono Nerd Font"; src: url("../wgpuTerminal/dist/fonts/JetBrainsMonoNerdFontMono-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: "JetBrains Mono Nerd Font"; src: url("../wgpuTerminal/dist/fonts/JetBrainsMonoNerdFontMono-Bold.ttf"); font-weight: 700; }
    @font-face { font-family: "JetBrains Mono Nerd Font"; src: url("../wgpuTerminal/dist/fonts/JetBrainsMonoNerdFontMono-Italic.ttf"); font-style: italic; font-weight: 400; }
    @font-face { font-family: "JetBrains Mono Nerd Font"; src: url("../wgpuTerminal/dist/fonts/JetBrainsMonoNerdFontMono-BoldItalic.ttf"); font-style: italic; font-weight: 700; }
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0a0c10; color: #f0f3f6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: clamp(16px, 4vw, 48px); }
    main { max-width: 1100px; margin: auto; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    .heading { display: flex; align-items: baseline; flex-wrap: wrap; gap: 12px; }
    #source { color: #9ea7b3; }
    #source[href] { color: #79c0ff; }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin: 20px 0; }
    button, .file-label { background: #161b22; color: #f0f3f6; border: 1px solid #7a828e; border-radius: 6px; padding: 8px 12px; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    button:focus-visible, .file-label:focus-within { outline: 2px solid #58a6ff; outline-offset: 2px; }
    .file-label input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    #status { color: #9ea7b3; }
    #terminal { height: min(65vh, 560px); min-height: 300px; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
  </style>
</head>
<body>
<main>
  <div class="heading"><h1>wgpuTerminal</h1><a id="source" href="https://asciinema.org/a/664965">asciinema #664965 ↗</a></div>
  <div class="controls">
    <button id="toggle" type="button" disabled>Play</button>
    <button id="restart" type="button" disabled>Replay</button>
    <label class="file-label">Open .cast <input id="file" type="file" accept=".cast" disabled></label>
    <output id="status" role="status" aria-live="polite">Loading…</output>
  </div>
  <div id="terminal"></div>
</main>
<script type="module">
  import { Terminal } from "../wgpuTerminal/src/index.js";

  const terminal = new Terminal({ wasmUrl: new URL("../wgpuTerminal/dist/terminal.wasm", import.meta.url).href });
  const toggle = document.querySelector("#toggle");
  const restart = document.querySelector("#restart");
  const status = document.querySelector("#status");
  const file = document.querySelector("#file");
  const source = document.querySelector("#source");
  const loading = new AbortController();
  let events = [];
  let next = 0;
  let elapsed = 0;
  let startedAt = 0;
  let timer;
  let selection = 0;

  function currentTime() {
    return elapsed + (timer ? (performance.now() - startedAt) / 1000 : 0);
  }

  function updateStatus() {
    const duration = events.at(-1)?.[0] ?? 0;
    const time = next === events.length ? Math.ceil(duration) : Math.floor(currentTime());
    const clock = seconds => `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    toggle.textContent = timer ? "Pause" : "Play";
    status.textContent = `${clock(time)} / ${clock(Math.ceil(duration))}`;
  }

  function pause() {
    if (timer) elapsed = currentTime();
    clearTimeout(timer);
    timer = null;
    updateStatus();
  }

  function tick() {
    const time = currentTime();
    let count = 0;
    while (next < events.length && events[next][0] <= time && count++ < 200) {
      terminal.write(events[next++][1]);
    }
    if (next === events.length) { pause(); return; }
    updateStatus();
    timer = setTimeout(tick, Math.min(1000, Math.max(0, (events[next][0] - time) * 1000)));
  }

  function play() {
    if (next === events.length) { replay(); return; }
    startedAt = performance.now();
    timer = setTimeout(tick, 0);
    updateStatus();
  }

  function replay() {
    pause();
    terminal.write("\x1bc\x1b[3J");
    next = elapsed = 0;
    play();
  }

  function loadCast(text) {
    const [header, ...lines] = text.trim().split(/\r?\n/);
    if (JSON.parse(header)?.version !== 2) throw new Error("Unsupported cast version");
    const output = [];
    let last = 0;
    for (const line of lines) {
      const [time, type, data] = JSON.parse(line);
      if (!Number.isFinite(time) || time < last || typeof data !== "string") throw new Error("Invalid cast event");
      last = time;
      if (type === "o") output.push([time, data]);
    }
    if (!output.length) throw new Error("Empty recording");
    events = output;
    toggle.disabled = restart.disabled = false;
    replay();
  }

  toggle.addEventListener("click", () => timer ? pause() : play());
  restart.addEventListener("click", replay);
  file.addEventListener("change", async () => {
    const selected = file.files[0];
    if (!selected) return;
    file.value = "";
    const choice = ++selection;
    try {
      if (selected.size > 8 * 1024 * 1024) throw new Error("File exceeds 8 MiB");
      const text = await selected.text();
      if (choice !== selection) return;
      loadCast(text);
      loading.abort();
      source.removeAttribute("href");
      source.textContent = selected.name;
    } catch (error) {
      if (choice === selection) status.textContent = `Cannot load recording: ${error.message}`;
    }
  });

  try {
    await terminal.open(document.querySelector("#terminal"));
    file.disabled = false;
  } catch (error) {
    status.textContent = "Terminal unavailable";
    console.error(error);
  }

  if (!file.disabled) {
    try {
      const response = await fetch("https://asciinema.org/a/664965.cast", { signal: loading.signal });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();
      if (!loading.signal.aborted) loadCast(text);
    } catch (error) {
      if (!loading.signal.aborted) {
        status.textContent = "Recording unavailable · open a .cast file";
        console.error(error);
      }
    }
  }
</script>
</body>
</html>
